<!DOCTYPE html>
<!-- NaviGuide app shell: loads UI tabs, local data storage, and Google Calendar integration. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaviGuide</title>
  <link rel="icon" type="image/svg+xml" href="src/assets/naviguide-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="src/styles/main.css?v=20260508c" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="src/assets/naviguide-logo.svg" alt="NaviGuide logo" />
        <span class="brand-name">NaviGuide</span>
      </div>
    <nav class="nav">
        <button class="nav-item active" data-tab="today">
          Today
        </button>

      <button class="nav-item" data-tab="log">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2.5" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M5 8h6M8 5v6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Log Trip
      </button>

      <button class="nav-item" data-tab="discover">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M10.5 5.5l-2 4.5-4.5 2 2-4.5 4.5-2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        Discover
      </button>
    </nav>
      <div class="sidebar-footer">
        <div class="api-status" id="api-status">
          <span class="status-dot"></span>
          <span class="status-text">AI ready</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="tab-pane active" id="tab-today"></div>
      <div class="tab-pane" id="tab-log"></div>
      <div class="tab-pane" id="tab-discover"></div>
    </main>
  </div>

  <script src="src/config.local.js"></script>
  <script src="src/data/store.js?v=20260508c"></script>
  <script src="src/services/maps.js?v=20260508c"></script>
  <script src="src/components/today.js?v=20260508c"></script>
  <script src="src/components/log.js?v=20260508c"></script>
  <script src="src/components/discover.js?v=20260508c"></script>

  <!-- Google APIs required for calendar auth and event sync -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Main app logic loads last so component functions are already available -->
  <script src="src/app.js?v=20260508c"></script>
</body>
</html>
